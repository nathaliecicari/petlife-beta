<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#6d4aff" />
  <meta name="description" content="PetLife — histórico digital inteligente da vida do seu pet." />
  <title>PetLife</title>
  <style>
:root {
  --bg: #f7f5fc;
  --surface: #ffffff;
  --surface-2: #f0ecff;
  --text: #22212a;
  --muted: #737181;
  --primary: #6d4aff;
  --primary-2: #8f75ff;
  --success: #27a86b;
  --danger: #d94b65;
  --warning: #e79b23;
  --border: #e7e2f3;
  --shadow: 0 14px 40px rgba(55, 32, 112, .10);
  --radius: 22px;
  --nav-h: 78px;
}

* { box-sizing: border-box; }
html { background: var(--bg); }
body {
  margin: 0;
  min-height: 100vh;
  color: var(--text);
  background:
    radial-gradient(circle at top left, rgba(143,117,255,.16), transparent 28%),
    linear-gradient(180deg, #fbfaff 0%, var(--bg) 45%, #f4f1fb 100%);
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
button, input, select, textarea { font: inherit; }
button { cursor: pointer; }
a { color: inherit; }

.app-shell { min-height: 100vh; }
.auth-shell {
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 24px;
}
.auth-card {
  width: min(100%, 440px);
  background: rgba(255,255,255,.93);
  border: 1px solid rgba(255,255,255,.8);
  box-shadow: var(--shadow);
  border-radius: 28px;
  padding: 28px;
  backdrop-filter: blur(12px);
}
.brand { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; }
.brand-mark {
  width: 52px; height: 52px; border-radius: 18px;
  display: grid; place-items: center;
  background: linear-gradient(135deg, var(--primary), var(--primary-2));
  color: white; font-size: 28px; box-shadow: 0 10px 24px rgba(109,74,255,.28);
}
.brand h1 { margin: 0; font-size: 28px; }
.brand p { margin: 2px 0 0; color: var(--muted); font-size: 14px; }

.main {
  width: min(100%, 1180px);
  margin: 0 auto;
  padding: 22px 20px calc(var(--nav-h) + 28px);
}
.topbar {
  display: flex; justify-content: space-between; align-items: center;
  gap: 18px; margin-bottom: 18px;
}
.topbar h1 { margin: 0; font-size: clamp(24px, 4vw, 34px); }
.topbar p { margin: 5px 0 0; color: var(--muted); }
.avatar {
  width: 46px; height: 46px; border-radius: 16px; object-fit: cover;
  display: grid; place-items: center; background: var(--surface-2); font-weight: 800;
  border: 1px solid var(--border);
}

.bottom-nav {
  position: fixed; z-index: 30; left: 50%; transform: translateX(-50%); bottom: 14px;
  width: min(calc(100% - 24px), 700px);
  background: rgba(255,255,255,.94); border: 1px solid rgba(231,226,243,.9);
  box-shadow: 0 18px 44px rgba(35,20,77,.16); backdrop-filter: blur(16px);
  border-radius: 24px; padding: 8px; display: grid; grid-template-columns: repeat(5, 1fr);
}
.nav-btn {
  border: 0; background: transparent; color: var(--muted);
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  padding: 8px 4px; border-radius: 16px; font-size: 11px;
}
.nav-btn span:first-child { font-size: 21px; }
.nav-btn.active { color: var(--primary); background: var(--surface-2); font-weight: 700; }

.grid { display: grid; gap: 16px; }
.grid.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.grid.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.card {
  background: rgba(255,255,255,.95); border: 1px solid var(--border);
  border-radius: var(--radius); box-shadow: 0 8px 24px rgba(55,32,112,.06);
  padding: 18px;
}
.card h2, .card h3 { margin-top: 0; }
.section-title { display:flex; justify-content:space-between; align-items:center; gap:12px; margin: 24px 0 12px; }
.section-title h2 { margin: 0; font-size: 20px; }
.link-btn { border:0; background:transparent; color:var(--primary); font-weight:700; padding:6px; }

.hero {
  background: linear-gradient(135deg, #6845f7 0%, #8a6dfc 70%, #a28cff 100%);
  color: white; border-radius: 28px; padding: 24px; box-shadow: 0 16px 36px rgba(109,74,255,.25);
  display:grid; grid-template-columns: 1fr auto; gap:20px; align-items:center;
}
.hero h2 { margin:0 0 8px; font-size: clamp(24px,4vw,34px); }
.hero p { margin:0; color:rgba(255,255,255,.84); max-width:660px; }
.hero .paw { font-size: 64px; opacity:.9; }

.pet-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; }
.pet-card { padding: 0; overflow: hidden; cursor: pointer; transition: .2s ease; }
.pet-card:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
.pet-photo { width:100%; aspect-ratio: 16 / 10; object-fit:cover; background:linear-gradient(135deg,#eee8ff,#ddd3ff); display:grid; place-items:center; font-size:54px; }
.pet-card-body { padding: 16px; }
.pet-card h3 { margin:0 0 5px; }
.meta { color: var(--muted); font-size: 14px; }

.list { display:flex; flex-direction:column; gap:10px; }
.list-item { display:flex; align-items:center; gap:12px; padding:12px; border-radius:16px; background:#faf9fd; border:1px solid var(--border); }
.list-icon { width:42px; height:42px; border-radius:14px; display:grid; place-items:center; background:var(--surface-2); font-size:21px; flex:0 0 auto; }
.list-body { min-width:0; flex:1; }
.list-body strong { display:block; }
.list-body small { color:var(--muted); }
.list-actions { display:flex; gap:6px; }

.btn {
  border:0; border-radius:15px; padding:12px 16px; font-weight:800;
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  transition:.15s ease;
}
.btn:hover { transform: translateY(-1px); }
.btn.primary { background:var(--primary); color:#fff; box-shadow:0 10px 20px rgba(109,74,255,.22); }
.btn.secondary { background:var(--surface-2); color:var(--primary); }
.btn.ghost { background:#fff; border:1px solid var(--border); color:var(--text); }
.btn.danger { background:#fff0f3; color:var(--danger); }
.btn.full { width:100%; }
.icon-btn { border:0; width:38px; height:38px; border-radius:12px; background:var(--surface-2); display:grid; place-items:center; }
.fab {
  position:fixed; z-index:35; right:22px; bottom:102px; width:58px; height:58px;
  border:0; border-radius:19px; background:linear-gradient(135deg,var(--primary),var(--primary-2));
  color:white; font-size:29px; box-shadow:0 16px 30px rgba(109,74,255,.34);
}

.form-grid { display:grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap:14px; }
.field { display:flex; flex-direction:column; gap:7px; }
.field.full { grid-column:1/-1; }
.field label { font-weight:700; font-size:14px; }
.field input, .field select, .field textarea {
  width:100%; border:1px solid var(--border); background:#fff; color:var(--text);
  border-radius:14px; padding:12px 13px; outline:none;
}
.field input:focus, .field select:focus, .field textarea:focus { border-color:var(--primary-2); box-shadow:0 0 0 4px rgba(109,74,255,.10); }
.field textarea { min-height:100px; resize:vertical; }
.helper { color:var(--muted); font-size:12px; }
.password-wrap { position:relative; }
.password-wrap input { padding-right:52px; }
.password-toggle {
  position:absolute; top:50%; right:8px; transform:translateY(-50%);
  width:38px; height:38px; border:0; border-radius:12px; background:transparent;
  display:grid; place-items:center; color:var(--muted); font-size:18px;
}
.password-toggle:hover, .password-toggle:focus-visible { background:var(--surface-2); color:var(--primary); outline:none; }
.auth-title { margin:0 0 6px; font-size:22px; }
.auth-subtitle { margin:0 0 20px; color:var(--muted); font-size:14px; }
.auth-switch { margin:18px 0 0; text-align:center; color:var(--muted); font-size:14px; }
.auth-switch button { border:0; background:transparent; color:var(--primary); font-weight:800; padding:4px; }
.consent { display:flex; align-items:flex-start; gap:10px; padding:4px 0; }
.consent input { width:18px; height:18px; margin-top:2px; flex:0 0 auto; accent-color:var(--primary); }
.consent label { font-weight:500; line-height:1.45; }
.consent a { color:var(--primary); font-weight:700; }
.auth-divider { display:flex; align-items:center; gap:12px; color:var(--muted); font-size:12px; margin:2px 0; }
.auth-divider:before, .auth-divider:after { content:""; height:1px; background:var(--border); flex:1; }

.modal-backdrop {
  position:fixed; inset:0; z-index:100; background:rgba(20,15,32,.48); backdrop-filter:blur(5px);
  display:grid; place-items:center; padding:18px;
}
.modal {
  width:min(100%,760px); max-height:92vh; overflow:auto; background:#fff; border-radius:26px;
  box-shadow:0 28px 80px rgba(0,0,0,.28); padding:22px;
}
.modal-head { display:flex; justify-content:space-between; align-items:center; gap:14px; margin-bottom:16px; }
.modal-head h2 { margin:0; }

.tabs { display:flex; gap:8px; overflow:auto; padding-bottom:3px; }
.tab { border:0; white-space:nowrap; border-radius:999px; padding:10px 14px; background:#fff; border:1px solid var(--border); color:var(--muted); font-weight:700; }
.tab.active { background:var(--primary); color:#fff; border-color:var(--primary); }

.profile-hero { display:grid; grid-template-columns:140px 1fr; gap:20px; align-items:center; }
.profile-photo { width:140px; height:140px; border-radius:30px; object-fit:cover; background:var(--surface-2); display:grid; place-items:center; font-size:64px; }
.badges { display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; }
.badge { background:var(--surface-2); color:var(--primary); border-radius:999px; padding:7px 10px; font-size:12px; font-weight:800; }
.stat-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-top:16px; }
.stat { background:#faf9fd; border:1px solid var(--border); border-radius:16px; padding:12px; }
.stat strong { display:block; font-size:18px; }
.stat small { color:var(--muted); }

.timeline { position:relative; padding-left:24px; }
.timeline:before { content:""; position:absolute; left:7px; top:6px; bottom:6px; width:2px; background:var(--border); }
.timeline-item { position:relative; margin-bottom:14px; }
.timeline-item:before { content:""; position:absolute; left:-22px; top:8px; width:12px; height:12px; border-radius:50%; background:var(--primary); box-shadow:0 0 0 4px var(--surface-2); }
.timeline-card { background:#fff; border:1px solid var(--border); border-radius:16px; padding:14px; }
.timeline-card h4 { margin:0 0 4px; }
.timeline-card p { margin:8px 0 0; color:var(--muted); }

.community-post { display:flex; flex-direction:column; gap:12px; }
.post-head { display:flex; gap:10px; align-items:center; }
.post-actions { display:flex; gap:10px; }
.post-actions button { border:0; background:var(--surface-2); border-radius:999px; padding:8px 12px; }

.kpis { display:grid; grid-template-columns:repeat(4,1fr); gap:14px; }
.kpi { padding:18px; border-radius:20px; background:linear-gradient(135deg,#fff,#f6f2ff); border:1px solid var(--border); }
.kpi strong { font-size:28px; display:block; }
.kpi span { color:var(--muted); font-size:13px; }

.empty { text-align:center; padding:30px 18px; color:var(--muted); }
.empty .emoji { font-size:52px; margin-bottom:10px; }
.toast {
  position:fixed; z-index:200; left:50%; transform:translateX(-50%) translateY(30px); bottom:110px;
  background:#22212a; color:#fff; padding:12px 16px; border-radius:14px; opacity:0; pointer-events:none; transition:.25s ease;
}
.toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
.notice { padding:12px 14px; border-radius:14px; background:#fff8e8; color:#79561b; border:1px solid #f2dfb5; font-size:13px; }
.ai-box { background:linear-gradient(135deg,#f0ecff,#faf8ff); border:1px solid #dcd3ff; border-radius:18px; padding:15px; }
.ai-box h4 { margin:0 0 6px; color:var(--primary); }

@media (min-width: 860px) {
  .main { padding-top:30px; }
  .bottom-nav { top:18px; bottom:auto; width:auto; left:auto; right:22px; transform:none; grid-template-columns:repeat(5,88px); }
  .main { padding-right:20px; }
  .fab { bottom:26px; }
}

@media (max-width: 760px) {
  .grid.two, .grid.three, .form-grid, .kpis { grid-template-columns:1fr; }
  .hero { grid-template-columns:1fr; }
  .hero .paw { display:none; }
  .profile-hero { grid-template-columns:1fr; text-align:center; }
  .profile-photo { margin:auto; }
  .stat-grid { grid-template-columns:repeat(2,1fr); }
}

  </style>
</head>
<body>
  <div id="app"></div>
  <input id="file-input" type="file" accept="image/jpeg,image/png,application/pdf" hidden />
  <div id="toast" class="toast" aria-live="polite"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => [...root.querySelectorAll(sel)];

const SUPABASE_URL = 'https://hvynreyyipjyzscfsxrf.supabase.co';
const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_zuOv4EYJJn6W6Yf9AoeHnQ_pAnW_GZs';
const SITE_URL = 'https://nathaliecicari.github.io/petlife-beta/';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, {
  auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
});

const categoryMap = {
  foto: ['📸', 'Foto'], vacina: ['💉', 'Vacina'], consulta: ['🩺', 'Consulta veterinária'],
  exame: ['🧪', 'Exame'], receita: ['🧾', 'Receita'], laudo: ['📑', 'Laudo'],
  medicamento: ['💊', 'Medicamento'], cirurgia: ['🏥', 'Cirurgia'], peso: ['⚖️', 'Alteração de peso'],
  comportamento: ['🐾', 'Comportamento'], alimentacao: ['🥣', 'Alimentação'], evento: ['✨', 'Evento importante'],
  documento: ['📄', 'Outro documento']
};

const state = {
  loading: true,
  session: null,
  authUser: null,
  db: { users: [], pets: [], records: [], reminders: [], posts: [], reports: [] },
  likedPostIds: new Set(),
  route: 'home',
  selectedPetId: null,
  petTab: 'overview',
  modal: null,
  adminStats: null,
  authTab: 'login'
};

function isoDate(d = new Date()) { return new Date(d).toISOString().slice(0, 10); }
function formatDate(d) {
  if (!d) return '—';
  const value = String(d).slice(0, 10);
  return new Intl.DateTimeFormat('pt-BR').format(new Date(`${value}T12:00:00`));
}
function formatDateTime(d) {
  if (!d) return '—';
  return new Intl.DateTimeFormat('pt-BR', { dateStyle: 'short', timeStyle: 'short' }).format(new Date(d));
}
function esc(v = '') { return String(v).replace(/[&<>'"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[c])); }
function getAge(date) {
  if (!date) return 'Idade não informada';
  const birth = new Date(`${date}T12:00:00`), now = new Date();
  let years = now.getFullYear() - birth.getFullYear();
  const m = now.getMonth() - birth.getMonth();
  if (m < 0 || (m === 0 && now.getDate() < birth.getDate())) years--;
  return years <= 0 ? 'Menos de 1 ano' : `${years} ano${years !== 1 ? 's' : ''}`;
}
function fileExt(name = '') { return (name.split('.').pop() || 'bin').toLowerCase().replace(/[^a-z0-9]/g, ''); }
function safeFileName(name = '') { return name.normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-zA-Z0-9._-]/g, '-').replace(/-+/g, '-'); }
function friendlyError(error, fallback = 'Ocorreu um erro. Tente novamente.') {
  console.error(error);
  const msg = error?.message || '';
  if (/Invalid login credentials/i.test(msg)) return 'E-mail ou senha inválidos.';
  if (/Email not confirmed/i.test(msg)) return 'Confirme seu e-mail antes de entrar.';
  if (/User already registered/i.test(msg)) return 'Este e-mail já está cadastrado.';
  if (/Password should be at least/i.test(msg)) return 'A senha deve ter pelo menos 8 caracteres.';
  if (/Email rate limit exceeded/i.test(msg)) return 'Muitos e-mails foram solicitados. Aguarde alguns minutos e tente novamente.';
  if (/For security purposes/i.test(msg)) return 'Aguarde alguns segundos antes de solicitar outro e-mail.';
  if (/duplicate key.*username/i.test(msg)) return 'Este nome de usuário já está em uso.';
  if (/Failed to fetch/i.test(msg)) return 'Não foi possível conectar à nuvem. Verifique sua internet.';
  return msg || fallback;
}
function currentUser() { return state.db.users[0] || null; }
function myPets() { return state.db.pets; }
function petById(id) { return state.db.pets.find(p => p.id === id); }
function petRecords(id) { return state.db.records.filter(r => r.petId === id).sort((a, b) => b.date.localeCompare(a.date)); }
function petReminders(id) { return state.db.reminders.filter(r => r.petId === id).sort((a, b) => a.date.localeCompare(b.date)); }
function ownerRecords() { return [...state.db.records].sort((a, b) => b.date.localeCompare(a.date)); }
function ownerReminders() { return [...state.db.reminders].sort((a, b) => a.date.localeCompare(b.date)); }
function petName(id) { return petById(id)?.name || 'Pet'; }
function toast(msg) {
  const el = $('#toast');
  if (!el) return;
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 3200);
}
function setBusy(button, busy, label = 'Aguarde...') {
  if (!button) return;
  if (busy) {
    button.dataset.originalLabel = button.innerHTML;
    button.disabled = true;
    button.innerHTML = label;
  } else {
    button.disabled = false;
    button.innerHTML = button.dataset.originalLabel || button.innerHTML;
  }
}
function bindPasswordToggles(root = document) {
  root.querySelectorAll('[data-toggle-password]').forEach(button => {
    if (button.dataset.passwordToggleBound) return;
    button.dataset.passwordToggleBound = 'true';
    button.addEventListener('click', () => {
      const input = document.getElementById(button.dataset.togglePassword);
      if (!input) return;
      const showing = input.type === 'text';
      input.type = showing ? 'password' : 'text';
      button.textContent = showing ? '👁' : '🙈';
      button.setAttribute('aria-label', showing ? 'Mostrar senha' : 'Ocultar senha');
      button.title = showing ? 'Mostrar senha' : 'Ocultar senha';
      input.focus();
    });
  });
}

async function signedUrl(bucket, path, expires = 3600) {
  if (!path) return '';
  const { data, error } = await sb.storage.from(bucket).createSignedUrl(path, expires);
  if (error) return '';
  return data.signedUrl;
}

async function ensureProfile() {
  const uid = state.authUser.id;
  let { data, error } = await sb.from('profiles').select('*').eq('id', uid).maybeSingle();
  if (error) throw error;
  if (data) return data;

  const metadata = state.authUser.user_metadata || {};
  const base = (metadata.username || (state.authUser.email || '').split('@')[0] || `usuario_${uid.slice(0, 6)}`)
    .toLowerCase().replace(/[^a-z0-9_]/g, '') || `usuario_${uid.slice(0, 6)}`;
  const payload = {
    id: uid,
    full_name: metadata.full_name || (state.authUser.email || '').split('@')[0] || 'Tutor',
    username: `${base}_${uid.slice(0, 6)}`
  };
  const created = await sb.from('profiles').insert(payload).select().single();
  if (created.error) throw created.error;
  return created.data;
}

function mapProfile(row, email, avatarUrl = '') {
  return {
    id: row.id,
    name: row.full_name || 'Tutor',
    username: row.username || '',
    email: email || '',
    phone: row.phone || '',
    city: row.city || '',
    state: row.state || '',
    photo: avatarUrl,
    avatarPath: row.avatar_path || '',
    role: row.role || 'user',
    createdAt: row.created_at
  };
}
function mapPet(row, photoUrl = '') {
  return {
    id: row.id,
    ownerId: row.owner_id,
    name: row.name,
    species: row.species,
    breed: row.breed || '',
    sex: row.sex || '',
    birthDate: row.birth_date || '',
    adoptionDate: row.adoption_date || '',
    color: row.color || '',
    weight: row.current_weight == null ? null : Number(row.current_weight),
    neutered: row.neutered || 'Não informado',
    microchip: row.has_microchip || 'Não informado',
    microchipNumber: row.microchip_number || '',
    notes: row.notes || '',
    photo: photoUrl,
    photoPath: row.photo_path || '',
    createdAt: row.created_at
  };
}
function mapRecord(row) {
  const a = Array.isArray(row.attachments) ? row.attachments[0] : null;
  return {
    id: row.id,
    ownerId: row.owner_id,
    petId: row.pet_id,
    category: row.category,
    title: row.title,
    date: row.event_date,
    description: row.description || '',
    clinic: row.clinic || '',
    vet: row.veterinarian || '',
    returnDate: row.return_date || '',
    weight: row.weight_kg == null ? null : Number(row.weight_kg),
    notes: row.notes || '',
    createdAt: row.created_at,
    attachment: a ? {
      id: a.id,
      name: a.file_name,
      type: a.mime_type,
      size: a.size_bytes,
      bucket: a.bucket_id,
      path: a.object_path,
      aiStatus: a.ai_status,
      aiClassification: a.ai_classification
    } : null
  };
}
function mapReminder(row) {
  return {
    id: row.id,
    ownerId: row.owner_id,
    petId: row.pet_id,
    title: row.title,
    type: row.type,
    date: row.due_date,
    notes: row.notes || '',
    done: !!row.done,
    createdAt: row.created_at
  };
}
function mapPost(row) {
  return {
    id: row.id,
    ownerId: row.owner_id,
    author: row.author_name,
    username: row.author_username,
    text: row.text,
    createdAt: row.created_at,
    likes: row.likes_count || 0,
    liked: state.likedPostIds.has(row.id),
    comments: row.comments_count || 0
  };
}

async function loadAdminData(profile) {
  state.adminStats = null;
  state.db.reports = [];
  if (profile.role !== 'admin') return;
  const [users, pets, records, reports] = await Promise.all([
    sb.from('profiles').select('*', { count: 'exact', head: true }),
    sb.from('pets').select('*', { count: 'exact', head: true }),
    sb.from('pet_records').select('*', { count: 'exact', head: true }),
    sb.from('reports').select('*', { count: 'exact', head: true })
  ]);
  state.adminStats = {
    users: users.count || 0,
    pets: pets.count || 0,
    records: records.count || 0,
    reports: reports.count || 0
  };
  const recent = await sb.from('reports').select('*').order('created_at', { ascending: false }).limit(20);
  if (!recent.error) state.db.reports = recent.data || [];
}

async function loadData({ quiet = false } = {}) {
  if (!state.authUser) return;
  if (!quiet) { state.loading = true; render(); }
  try {
    const profileRow = await ensureProfile();
    const [petsRes, recordsRes, remindersRes, postsRes, likesRes] = await Promise.all([
      sb.from('pets').select('*').order('created_at', { ascending: true }),
      sb.from('pet_records').select('*, attachments(*)').order('event_date', { ascending: false }),
      sb.from('reminders').select('*').order('due_date', { ascending: true }),
      sb.from('community_posts').select('*').order('created_at', { ascending: false }).limit(100),
      sb.from('community_likes').select('post_id').eq('user_id', state.authUser.id)
    ]);
    for (const result of [petsRes, recordsRes, remindersRes, postsRes, likesRes]) if (result.error) throw result.error;

    state.likedPostIds = new Set((likesRes.data || []).map(x => x.post_id));
    const avatarUrl = profileRow.avatar_path ? await signedUrl('avatars', profileRow.avatar_path) : '';
    const pets = await Promise.all((petsRes.data || []).map(async row => mapPet(row, row.photo_path ? await signedUrl('pet-files', row.photo_path) : '')));
    state.db.users = [mapProfile(profileRow, state.authUser.email, avatarUrl)];
    state.db.pets = pets;
    state.db.records = await Promise.all((recordsRes.data || []).map(async row => {
      const record = mapRecord(row);
      if (record.attachment?.type?.startsWith('image/')) record.attachment.url = await signedUrl(record.attachment.bucket, record.attachment.path);
      return record;
    }));
    state.db.reminders = (remindersRes.data || []).map(mapReminder);
    state.db.posts = (postsRes.data || []).map(mapPost);
    await loadAdminData(state.db.users[0]);
  } catch (error) {
    toast(friendlyError(error, 'Não foi possível carregar seus dados.'));
  } finally {
    state.loading = false;
    render();
  }
}

function render() {
  const app = $('#app');
  if (state.loading) {
    app.innerHTML = `<div class="auth-shell"><div class="auth-card" style="text-align:center"><div class="brand-mark" style="margin:0 auto 18px">🐾</div><h2>Carregando PetLife</h2><p class="meta">Conectando com sua nuvem segura...</p></div></div>`;
    return;
  }

}

async function login(e) {
  e.preventDefault();
  const button = e.submitter, f = new FormData(e.target);
  setBusy(button, true, 'Entrando...');
  const { error } = await sb.auth.signInWithPassword({ email: String(f.get('email')).trim().toLowerCase(), password: String(f.get('password')) });
  setBusy(button, false);
  if (error) toast(friendlyError(error));
}
async function signup(e) {
  e.preventDefault();
  const button = e.submitter, f = new FormData(e.target);
  const password = String(f.get('password'));
  const passwordConfirm = String(f.get('passwordConfirm'));
  if (password !== passwordConfirm) return toast('As senhas não coincidem. Confira e tente novamente.');
  if (!f.get('terms')) return toast('É necessário aceitar os Termos de Uso e declarar ciência da Política de Privacidade.');
  setBusy(button, true, 'Criando conta...');
  const email = String(f.get('email')).trim().toLowerCase();
  const { data, error } = await sb.auth.signUp({
    email,
    password,
    options: {
      emailRedirectTo: SITE_URL,
      data: { full_name: String(f.get('name')).trim(), username: String(f.get('username')).trim().toLowerCase() }
    }
  });
  setBusy(button, false);
  if (error) return toast(friendlyError(error));
  if (!data.session) {
    state.authTab = 'login';
    render();
    toast('Conta criada. Enviamos um e-mail para você confirmar o cadastro.');
  }
}

async function savePet(e) {
  e.preventDefault();
  const button = e.submitter, f = new FormData(e.target), old = petById(String(f.get('id'))), id = old?.id || crypto.randomUUID();
  const file = f.get('photoFile');
  if (file?.size && file.size > 5 * 1024 * 1024) return toast('A foto deve ter até 5 MB.');
  setBusy(button, true, 'Salvando...');
  try {
    let photoPath = old?.photoPath || null;
    const payload = {
      id,
      owner_id: state.authUser.id,
      name: String(f.get('name')).trim(),
      species: String(f.get('species')),
      breed: String(f.get('breed') || ''),
      sex: String(f.get('sex') || ''),
      birth_date: String(f.get('birthDate') || '') || null,
      adoption_date: String(f.get('adoptionDate') || '') || null,
      color: String(f.get('color') || ''),
      current_weight: Number(f.get('weight')) || null,
      neutered: String(f.get('neutered') || 'Não informado'),
      has_microchip: String(f.get('microchip') || 'Não informado'),
      microchip_number: String(f.get('microchipNumber') || ''),
      notes: String(f.get('notes') || ''),
      photo_path: photoPath
    };
    const saved = old ? await sb.from('pets').update(payload).eq('id', id) : await sb.from('pets').insert(payload);
    if (saved.error) throw saved.error;

    if (file?.size) {
      const path = `${state.authUser.id}/${id}/profile-${Date.now()}.${fileExt(file.name)}`;
      const uploaded = await sb.storage.from('pet-files').upload(path, file, { contentType: file.type, upsert: false });
      if (uploaded.error) throw uploaded.error;
      const updated = await sb.from('pets').update({ photo_path: path }).eq('id', id);
      if (updated.error) throw updated.error;
      if (photoPath) await sb.storage.from('pet-files').remove([photoPath]);
    }
    closeModal();
    state.selectedPetId = id;
    state.route = 'pet';
    await loadData();
    toast('Pet salvo na nuvem.');
  } catch (error) {
    toast(friendlyError(error, 'Não foi possível salvar o pet.'));
  } finally { setBusy(button, false); }
}
async function deletePet(id) {
  if (!confirm('Excluir este pet e todos os registros, documentos e lembretes relacionados?')) return;
  const pet = petById(id), recordPaths = state.db.records.filter(r => r.petId === id && r.attachment).map(r => r.attachment.path);
  const paths = [pet?.photoPath, ...recordPaths].filter(Boolean);
  if (paths.length) await sb.storage.from('pet-files').remove(paths);
  const { error } = await sb.from('pets').delete().eq('id', id);
  if (error) return toast(friendlyError(error));
  closeModal(); state.route = 'pets'; state.selectedPetId = null; await loadData(); toast('Pet excluído.');
}

function simulateAI(e) {

  box.innerHTML = `<div class="ai-box"><h4>✨ Organização inteligente</h4><p>O arquivo será salvo como <strong>${guess}</strong> e ficará vinculado ao pet selecionado.</p><p class="helper">Nesta etapa, a classificação é baseada no nome do arquivo. A leitura OCR/IA real será conectada depois.</p></div>`;
}
function guessDoc(name) { const n = name.toLowerCase(); if (n.includes('vac')) return 'comprovante de vacina'; if (n.includes('rece')) return 'receita'; if (n.includes('exam')) return 'exame'; if (n.includes('laudo')) return 'laudo'; return 'documento do pet'; }
async function saveRecord(e) {
  e.preventDefault();
  const button = e.submitter, f = new FormData(e.target), file = f.get('attachment');
  if (file?.size) {
    const limit = file.type === 'application/pdf' ? 10 : 5;
    if (file.size > limit * 1024 * 1024) return toast(`O arquivo deve ter até ${limit} MB.`);
    if (!['image/jpeg', 'image/png', 'application/pdf'].includes(file.type)) return toast('Formato de arquivo não permitido.');
  }
  setBusy(button, true, 'Salvando...');
  try {
    const recordId = crypto.randomUUID(), petId = String(f.get('petId')), category = String(f.get('category'));
    const payload = {
      id: recordId,
      owner_id: state.authUser.id,
      pet_id: petId,
      category,
      title: String(f.get('title')).trim(),
      event_date: String(f.get('date')),
      description: String(f.get('description') || ''),
      clinic: String(f.get('clinic') || ''),
      veterinarian: String(f.get('vet') || ''),
      return_date: String(f.get('returnDate') || '') || null,
      weight_kg: Number(f.get('weight')) || null
    };
    const inserted = await sb.from('pet_records').insert(payload);
    if (inserted.error) throw inserted.error;

    if (file?.size) {
      const path = `${state.authUser.id}/${petId}/${recordId}/${Date.now()}-${safeFileName(file.name)}`;
      const uploaded = await sb.storage.from('pet-files').upload(path, file, { contentType: file.type, upsert: false });
      if (uploaded.error) throw uploaded.error;
      const attachment = await sb.from('attachments').insert({
        owner_id: state.authUser.id,
        pet_id: petId,
        record_id: recordId,
        bucket_id: 'pet-files',
        object_path: path,
        file_name: file.name,
        mime_type: file.type,
        size_bytes: file.size,
        category,
        ai_status: 'needs_review',
        ai_classification: guessDoc(file.name)
      });
      if (attachment.error) throw attachment.error;
    }
    if (category === 'peso' && payload.weight_kg) await sb.from('pets').update({ current_weight: payload.weight_kg }).eq('id', petId);
    if (f.get('createReminder') && payload.return_date) {
      const reminder = await sb.from('reminders').insert({ owner_id: state.authUser.id, pet_id: petId, title: `Retorno: ${payload.title}`, type: category, due_date: payload.return_date, notes: 'Criado a partir de um registro.' });
      if (reminder.error) throw reminder.error;
    }
    closeModal(); state.selectedPetId = petId; state.route = 'pet'; state.petTab = 'timeline'; await loadData(); toast('Registro salvo na nuvem.');
  } catch (error) { toast(friendlyError(error, 'Não foi possível salvar o registro.')); }
  finally { setBusy(button, false); }
}
async function deleteRecord(id) {
  if (!confirm('Excluir este registro?')) return;
  const record = state.db.records.find(x => x.id === id);
  if (record?.attachment) await sb.storage.from(record.attachment.bucket).remove([record.attachment.path]);
  const { error } = await sb.from('pet_records').delete().eq('id', id);
  if (error) return toast(friendlyError(error));
  await loadData({ quiet: true }); toast('Registro excluído.');
}
async function viewFile(id) {
  const record = state.db.records.find(x => x.id === id);

    let avatarPath = u.avatarPath || null;
    if (avatar?.size) {
      const path = `${state.authUser.id}/avatar-${Date.now()}.${fileExt(avatar.name)}`;
      const uploaded = await sb.storage.from('avatars').upload(path, avatar, { contentType: avatar.type, upsert: false });
      if (uploaded.error) throw uploaded.error;
      if (avatarPath) await sb.storage.from('avatars').remove([avatarPath]);
      avatarPath = path;
    }
    const email = String(f.get('email')).trim().toLowerCase();
    if (email !== state.authUser.email) {
      const changed = await sb.auth.updateUser({ email });
      if (changed.error) throw changed.error;
      toast('Confirme o novo e-mail para concluir a alteração.');
    }
    const updated = await sb.from('profiles').update({
      full_name: String(f.get('name')).trim(),
      username: String(f.get('username')).trim().toLowerCase(),
      phone: String(f.get('phone') || ''),
      city: String(f.get('city') || ''),
      state: String(f.get('state') || '').toUpperCase(),
      avatar_path: avatarPath
    }).eq('id', state.authUser.id);
    if (updated.error) throw updated.error;
    await sb.from('community_posts').update({ author_name: String(f.get('name')).trim(), author_username: String(f.get('username')).trim().toLowerCase() }).eq('owner_id', state.authUser.id);
    await loadData(); toast('Perfil atualizado.');
  } catch (error) { toast(friendlyError(error, 'Não foi possível atualizar o perfil.')); }
  finally { setBusy(button, false); }
}
function exportData() {
  const blob = new Blob([JSON.stringify({ user: currentUser(), pets: myPets(), records: ownerRecords(), reminders: ownerReminders() }, null, 2)], { type: 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'petlife-meus-dados.json'; a.click(); URL.revokeObjectURL(a.href);
}
async function requestAccountDeletion() {
  if (!confirm('Deseja solicitar a exclusão da sua conta e de todos os dados? Durante a beta, a solicitação será revisada administrativamente.')) return;
  const { error } = await sb.from('account_deletion_requests').upsert({ user_id: state.authUser.id, status: 'requested' }, { onConflict: 'user_id' });
  if (error) return toast(friendlyError(error));
  toast('Solicitação registrada. Você será desconectada.');
  setTimeout(logout, 1000);
}

async function handleAuthEvent(event, session) {
  state.session = session;
  state.authUser = session?.user || null;
  if (!session) {
    state.db = { users: [], pets: [], records: [], reminders: [], posts: [], reports: [] };
    state.loading = false; state.route = 'home'; state.selectedPetId = null; render(); return;
  }
  const isRecovery = event === 'PASSWORD_RECOVERY';
  await loadData();
  if (isRecovery) openPasswordRecoveryModal();
}
function openPasswordRecoveryModal() {
  state.modal = `<div class="modal-head"><div><h2>Definir nova senha</h2><p class="meta" style="margin:5px 0 0">Crie uma nova senha com pelo menos 8 caracteres.</p></div><button class="icon-btn" data-close-modal>✕</button></div><form id="recovery-form" class="form-grid"><div class="field full"><label for="recovery-password">Nova senha</label><div class="password-wrap"><input id="recovery-password" type="password" name="password" autocomplete="new-password" minlength="8" required><button type="button" class="password-toggle" data-toggle-password="recovery-password" aria-label="Mostrar senha" title="Mostrar senha">👁</button></div></div><div class="field full"><label for="recovery-password-confirm">Confirmar nova senha</label><div class="password-wrap"><input id="recovery-password-confirm" type="password" name="passwordConfirm" autocomplete="new-password" minlength="8" required><button type="button" class="password-toggle" data-toggle-password="recovery-password-confirm" aria-label="Mostrar senha" title="Mostrar senha">👁</button></div></div><div class="field full"><button class="btn primary full">Atualizar senha</button></div></form>`;
  renderModal();
  $('#recovery-form').addEventListener('submit', async e => {
    e.preventDefault();
    const button = e.submitter, f = new FormData(e.target);
    const password = String(f.get('password'));
    const passwordConfirm = String(f.get('passwordConfirm'));
    if (password !== passwordConfirm) return toast('As senhas não coincidem. Confira e tente novamente.');
    setBusy(button, true, 'Atualizando...');
    const { error } = await sb.auth.updateUser({ password });
    setBusy(button, false);
    if (error) return toast(friendlyError(error));
    closeModal();
    toast('Senha atualizada com sucesso. Entre novamente com sua nova senha.');
    setTimeout(async () => {
      await sb.auth.signOut();
      state.authTab = 'login';
    }, 1200);
  });
}

async function boot() {
  const { data, error } = await sb.auth.getSession();
  if (error) console.error(error);
  state.session = data.session;
  state.authUser = data.session?.user || null;
  sb.auth.onAuthStateChange((event, session) => setTimeout(() => handleAuthEvent(event, session), 0));
  if (state.authUser) await loadData();
  else { state.loading = false; render(); }
}

boot();

  </script>
