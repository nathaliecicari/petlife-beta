body {

.app-shell { min-height: 100vh; }

}
.auth-card {

}
.brand { display:flex; flex-direction:column; align-items:center; text-align:center; margin-bottom:22px; }

.main {

}
.topbar {
  display: flex; justify-content: space-between; align-items: center;

}
.topbar h1 { margin: 0; font-size: clamp(24px, 4vw, 34px); }
.topbar p { margin: 5px 0 0; color: var(--muted); }
.avatar {
  width: 46px; height: 46px; border-radius: 16px; object-fit: cover;
  display: grid; place-items: center; background: var(--surface-2); font-weight: 800;
  border: 1px solid var(--border);
}

.bottom-nav {
  position: fixed; z-index: 30; left: 50%; transform: translateX(-50%); bottom: 14px;
  width: min(calc(100% - 24px), 700px);
  background: rgba(255,255,255,.94); border: 1px solid rgba(231,226,243,.9);
  box-shadow: 0 18px 44px rgba(35,20,77,.16); backdrop-filter: blur(16px);
  border-radius: 24px; padding: 8px; display: grid; grid-template-columns: repeat(5, 1fr);
}
.nav-btn {
  border: 0; background: transparent; color: var(--muted);
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  padding: 8px 4px; border-radius: 16px; font-size: 11px;
}
.nav-btn span:first-child { font-size: 21px; }
.nav-btn.active { color: var(--primary); background: var(--surface-2); font-weight: 700; }

.grid { display: grid; gap: 16px; }
.grid.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.grid.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.card {
  background: rgba(255,255,255,.95); border: 1px solid var(--border);
  border-radius: var(--radius); box-shadow: 0 8px 24px rgba(55,32,112,.06);
  padding: 18px;
}
.card h2, .card h3 { margin-top: 0; }
.section-title { display:flex; justify-content:space-between; align-items:center; gap:12px; margin: 24px 0 12px; }
.section-title h2 { margin: 0; font-size: 20px; }
.link-btn { border:0; background:transparent; color:var(--primary); font-weight:700; padding:6px; }

.hero {

.pet-card-body { padding: 16px; }
.pet-card h3 { margin:0 0 5px; }
.meta { color: var(--muted); font-size: 14px; }

.list-item { display:flex; align-items:center; gap:12px; padding:12px; border-radius:16px; background:#faf9fd; border:1px solid var(--border); }

.list-body { min-width:0; flex:1; }
.list-body strong { display:block; }
.list-body small { color:var(--muted); }
.list-actions { display:flex; gap:6px; }

.btn {

  transition:.15s ease;
}
.btn:hover { transform: translateY(-1px); }
.btn.primary { background:var(--primary); color:#fff; box-shadow:0 10px 20px rgba(109,74,255,.22); }
.btn.secondary { background:var(--surface-2); color:var(--primary); }
.btn.ghost { background:#fff; border:1px solid var(--border); color:var(--text); }
.btn.danger { background:#fff0f3; color:var(--danger); }
.btn.full { width:100%; }
.icon-btn { border:0; width:38px; height:38px; border-radius:12px; background:var(--surface-2); display:grid; place-items:center; }
.fab {
  position:fixed; z-index:35; right:22px; bottom:102px; width:58px; height:58px;

  color:white; font-size:29px; box-shadow:0 16px 30px rgba(109,74,255,.34);
}

.field { display:flex; flex-direction:column; gap:7px; }
.field.full { grid-column:1/-1; }
.field label { font-weight:700; font-size:14px; }
.field input, .field select, .field textarea {

.helper { color:var(--muted); font-size:12px; }

.soon-badge { font-size:10px; color:var(--primary); background:var(--surface-2); border-radius:999px; padding:4px 7px; }
.modal-title-group { display:flex; align-items:center; gap:8px; min-width:0; }
.back-btn { border:0; width:38px; height:38px; border-radius:12px; background:var(--surface-2); display:grid; place-items:center; color:var(--primary); font-size:19px; flex:0 0 auto; }
.info-hint { display:flex; gap:8px; align-items:flex-start; border:1px solid #ddd5ff; background:#f8f6ff; color:#55467f; border-radius:14px; padding:10px 12px; font-size:12px; line-height:1.45; }

.timeline { position:relative; padding-left:24px; }

.timeline-item { position:relative; margin-bottom:14px; }
.timeline-item:before { content:""; position:absolute; left:-22px; top:8px; width:12px; height:12px; border-radius:50%; background:var(--primary); box-shadow:0 0 0 4px var(--surface-2); }
.timeline-card { background:#fff; border:1px solid var(--border); border-radius:16px; padding:14px; }

.community-post { display:flex; flex-direction:column; gap:12px; }
.post-head { display:flex; gap:10px; align-items:center; }
.post-actions { display:flex; gap:10px; }

.kpis { display:grid; grid-template-columns:repeat(4,1fr); gap:14px; }
.kpi { padding:18px; border-radius:20px; background:linear-gradient(135deg,#fff,#f6f2ff); border:1px solid var(--border); }
.kpi strong { font-size:28px; display:block; }
.kpi span { color:var(--muted); font-size:13px; }

.empty { text-align:center; padding:30px 18px; color:var(--muted); }
.empty .emoji { font-size:52px; margin-bottom:10px; }
.toast {
  position:fixed; z-index:200; left:50%; transform:translateX(-50%) translateY(30px); bottom:110px;

  .profile-photo { margin:auto; }
  .stat-grid { grid-template-columns:repeat(2,1fr); }
}

function isoDate(d = new Date()) { return new Date(d).toISOString().slice(0, 10); }
function formatDate(d) {
  if (!d) return '—';
  const value = String(d).slice(0, 10);
  return new Intl.DateTimeFormat('pt-BR').format(new Date(`${value}T12:00:00`));
}
function formatDateTime(d) {
  if (!d) return '—';
  return new Intl.DateTimeFormat('pt-BR', { dateStyle: 'short', timeStyle: 'short' }).format(new Date(d));
}
function esc(v = '') { return String(v).replace(/[&<>'"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[c])); }
function getAge(date) {
  if (!date) return 'Idade não informada';
  const birth = new Date(`${date}T12:00:00`), now = new Date();
  let years = now.getFullYear() - birth.getFullYear();
  const m = now.getMonth() - birth.getMonth();
  if (m < 0 || (m === 0 && now.getDate() < birth.getDate())) years--;
  return years <= 0 ? 'Menos de 1 ano' : `${years} ano${years !== 1 ? 's' : ''}`;
}
function fileExt(name = '') { return (name.split('.').pop() || 'bin').toLowerCase().replace(/[^a-z0-9]/g, ''); }
function safeFileName(name = '') { return name.normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-zA-Z0-9._-]/g, '-').replace(/-+/g, '-'); }
function friendlyError(error, fallback = 'Ocorreu um erro. Tente novamente.') {
  console.error(error);
  const msg = error?.message || '';
  if (/Invalid login credentials/i.test(msg)) return 'E-mail ou senha inválidos.';
  if (/Email not confirmed/i.test(msg)) return 'Confirme seu e-mail antes de entrar.';
  if (/User already registered/i.test(msg)) return 'Este e-mail já está cadastrado.';
  if (/Password should be at least/i.test(msg)) return 'A senha deve ter pelo menos 8 caracteres.';
  if (/Email rate limit exceeded/i.test(msg)) return 'Muitos e-mails foram solicitados. Aguarde alguns minutos e tente novamente.';
  if (/For security purposes/i.test(msg)) return 'Aguarde alguns segundos antes de solicitar outro e-mail.';
  if (/duplicate key.*username/i.test(msg)) return 'Este nome de usuário já está em uso.';
  if (/column .*source_record_id|column .*source_expense_id|pet_expenses.*does not exist|relation .*pet_expenses/i.test(msg)) return 'A atualização financeira ainda não foi aplicada no Supabase. Execute o arquivo SQL de migração.';
  if (/Failed to fetch/i.test(msg)) return 'Não foi possível conectar à nuvem. Verifique sua internet.';
  return msg || fallback;
}
function currentUser() { return state.db.users[0] || null; }
function myPets() { return state.db.pets; }
function petById(id) { return state.db.pets.find(p => p.id === id); }
function petRecords(id) { return state.db.records.filter(r => r.petId === id).sort((a, b) => b.date.localeCompare(a.date)); }
function petReminders(id) { return state.db.reminders.filter(r => r.petId === id).sort((a, b) => a.date.localeCompare(b.date)); }
function ownerRecords() { return [...state.db.records].sort((a, b) => b.date.localeCompare(a.date)); }
function ownerReminders() { return [...state.db.reminders].sort((a, b) => a.date.localeCompare(b.date)); }
function petExpenses(id) { return state.db.expenses.filter(x => x.petId === id).sort((a, b) => b.date.localeCompare(a.date)); }
function ownerExpenses() { return [...state.db.expenses].sort((a, b) => b.date.localeCompare(a.date)); }
function formatCurrency(value) { return new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(Number(value) || 0); }
function parseMoney(value) {
  const raw = String(value || '').trim().replace(/\s/g, '');
  if (!raw) return NaN;
  const normalized = raw.includes(',') ? raw.replace(/\./g, '').replace(',', '.') : raw;
  return Number(normalized.replace(/[^0-9.-]/g, ''));
}
function isMissingExpenseTable(error) { return error?.code === '42P01' || /pet_expenses.*does not exist|relation .*pet_expenses/i.test(error?.message || ''); }
function petName(id) { return petById(id)?.name || 'Pet'; }
function toast(msg) {
  const el = $('#toast');
  if (!el) return;
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 3200);
}
function setBusy(button, busy, label = 'Aguarde...') {
  if (!button) return;
  if (busy) {
    button.dataset.originalLabel = button.innerHTML;
    button.disabled = true;
    button.innerHTML = label;
  } else {
    button.disabled = false;
    button.innerHTML = button.dataset.originalLabel || button.innerHTML;
  }
}
function bindPasswordToggles(root = document) {
  root.querySelectorAll('[data-toggle-password]').forEach(button => {
    if (button.dataset.passwordToggleBound) return;
    button.dataset.passwordToggleBound = 'true';
    button.addEventListener('click', () => {
      const input = document.getElementById(button.dataset.togglePassword);
      if (!input) return;
      const showing = input.type === 'text';
      input.type = showing ? 'password' : 'text';
      button.textContent = showing ? '👁' : '🙈';
      button.setAttribute('aria-label', showing ? 'Mostrar senha' : 'Ocultar senha');
      button.title = showing ? 'Mostrar senha' : 'Ocultar senha';
      input.focus();
    });
  });
}

async function signedUrl(bucket, path, expires = 3600) {
  if (!path) return '';
  const { data, error } = await sb.storage.from(bucket).createSignedUrl(path, expires);
  if (error) return '';
  return data.signedUrl;
}

async function ensureProfile() {
  const uid = state.authUser.id;
  let { data, error } = await sb.from('profiles').select('*').eq('id', uid).maybeSingle();
  if (error) throw error;
  if (data) return data;

  const metadata = state.authUser.user_metadata || {};
  const base = (metadata.username || (state.authUser.email || '').split('@')[0] || `usuario_${uid.slice(0, 6)}`)
    .toLowerCase().replace(/[^a-z0-9_]/g, '') || `usuario_${uid.slice(0, 6)}`;
  const payload = {
    id: uid,
    full_name: metadata.full_name || (state.authUser.email || '').split('@')[0] || 'Tutor',
    username: `${base}_${uid.slice(0, 6)}`
  };
  const created = await sb.from('profiles').insert(payload).select().single();
  if (created.error) throw created.error;
  return created.data;
}

function mapProfile(row, email, avatarUrl = '') {

function mapPet(row, photoUrl = '') {

function mapRecord(row) {

    attachment: a ? {
      id: a.id,
      name: a.file_name,
      type: a.mime_type,
      size: a.size_bytes,
      bucket: a.bucket_id,
      path: a.object_path,
      aiStatus: a.ai_status,
      aiClassification: a.ai_classification
    } : null
  };
}
function mapReminder(row) {

}
function mapExpense(row) {

}
function mapPost(row) {

async function loadAdminData(profile) {
  state.adminStats = null;
  state.db.reports = [];
  if (profile.role !== 'admin') return;
  const [users, pets, records, reports] = await Promise.all([
    sb.from('profiles').select('*', { count: 'exact', head: true }),
    sb.from('pets').select('*', { count: 'exact', head: true }),
    sb.from('pet_records').select('*', { count: 'exact', head: true }),
    sb.from('reports').select('*', { count: 'exact', head: true })
  ]);
  state.adminStats = {
    users: users.count || 0,
    pets: pets.count || 0,
    records: records.count || 0,
    reports: reports.count || 0
  };
  const recent = await sb.from('reports').select('*').order('created_at', { ascending: false }).limit(20);
  if (!recent.error) state.db.reports = recent.data || [];
}

async function loadData({ quiet = false } = {}) {
  if (!state.authUser) return;
  if (!quiet) { state.loading = true; render(); }
  try {
    const profileRow = await ensureProfile();
    const [petsRes, recordsRes, expensesRes, remindersRes, postsRes, likesRes] = await Promise.all([
      sb.from('pets').select('*').order('created_at', { ascending: true }),
      sb.from('pet_records').select('*, attachments(*)').order('event_date', { ascending: false }),
      sb.from('pet_expenses').select('*').order('expense_date', { ascending: false }),
      sb.from('reminders').select('*').order('due_date', { ascending: true }),
      sb.from('community_posts').select('*').order('created_at', { ascending: false }).limit(100),
      sb.from('community_likes').select('post_id').eq('user_id', state.authUser.id)
    ]);
    for (const result of [petsRes, recordsRes, remindersRes, postsRes, likesRes]) if (result.error) throw result.error;
    if (expensesRes.error && !isMissingExpenseTable(expensesRes.error)) throw expensesRes.error;
    state.features.expensesAvailable = !expensesRes.error;

    state.likedPostIds = new Set((likesRes.data || []).map(x => x.post_id));
    const avatarUrl = profileRow.avatar_path ? await signedUrl('avatars', profileRow.avatar_path) : '';
    const pets = await Promise.all((petsRes.data || []).map(async row => mapPet(row, row.photo_path ? await signedUrl('pet-files', row.photo_path) : '')));
    state.db.users = [mapProfile(profileRow, state.authUser.email, avatarUrl)];
    state.db.pets = pets;
    state.db.records = await Promise.all((recordsRes.data || []).map(async row => {
      const record = mapRecord(row);
      if (record.attachment?.type?.startsWith('image/')) record.attachment.url = await signedUrl(record.attachment.bucket, record.attachment.path);
      return record;
    }));
    state.db.expenses = (expensesRes.data || []).map(mapExpense);
    state.db.reminders = (remindersRes.data || []).map(mapReminder);
    state.db.posts = (postsRes.data || []).map(mapPost);
    await loadAdminData(state.db.users[0]);
  } catch (error) {
    toast(friendlyError(error, 'Não foi possível carregar seus dados.'));
  } finally {
    state.loading = false;
    render();
  }
}

function renderTimeline(recs, expenses = []) {
  const activities = recentPetActivities(recs, expenses);

  return `<div class="card"><div class="timeline">${activities.map(activity => {

      return `<div class="timeline-item"><div class="timeline-card"><h4>💰 ${esc(x.title)}</h4><small>${formatDate(x.date)} · ${esc(x.type)} · ${formatCurrency(x.amount)}</small>${x.description ? `<p>${esc(x.description)}</p>` : ''}${x.attachment ? `<button class="link-btn" data-view-expense-file="${x.id}">Abrir ${esc(x.attachment.name)}</button>` : ''}</div></div>`;
    }
    const r = activity.item, [icon, label] = categoryMap[r.category] || ['📌', 'Registro'];
    return `<div class="timeline-item"><div class="timeline-card"><h4>${icon} ${esc(r.title)}</h4><small>${formatDate(r.date)} · ${label}</small>${r.description ? `<p>${esc(r.description)}</p>` : ''}${r.attachment ? `<button class="link-btn" data-view-file="${r.id}">Abrir ${esc(r.attachment.name)}</button>` : ''}</div></div>`;
  }).join('')}</div></div>`;

function renderActivityListItem(activity) { return activity.kind === 'expense' ? renderExpenseListItem(activity.item) : renderRecordListItem(activity.item); }

async function login(e) {
  e.preventDefault();
  const button = e.submitter, f = new FormData(e.target);
  setBusy(button, true, 'Entrando...');
  const { error } = await sb.auth.signInWithPassword({ email: String(f.get('email')).trim().toLowerCase(), password: String(f.get('password')) });
  setBusy(button, false);
  if (error) toast(friendlyError(error));
}
async function signup(e) {
  e.preventDefault();
  const button = e.submitter, f = new FormData(e.target);
  const password = String(f.get('password'));
  const passwordConfirm = String(f.get('passwordConfirm'));
  if (password !== passwordConfirm) return toast('As senhas não coincidem. Confira e tente novamente.');
  if (!f.get('terms')) return toast('É necessário aceitar os Termos de Uso e declarar ciência da Política de Privacidade.');
  setBusy(button, true, 'Criando conta...');
  const email = String(f.get('email')).trim().toLowerCase();
  const { data, error } = await sb.auth.signUp({
    email,
    password,
    options: {
      emailRedirectTo: SITE_URL,
      data: { full_name: String(f.get('name')).trim(), username: String(f.get('username')).trim().toLowerCase() }
    }
  });
  setBusy(button, false);
  if (error) return toast(friendlyError(error));
  if (!data.session) {
    state.authTab = 'login';
    render();
    toast('Conta criada. Enviamos um e-mail para você confirmar o cadastro.');
  }
}

function initializePetPhotoEditor(e) {
  const file = e.target.files?.[0];
  if (!file) return;
  if (file.size > 5 * 1024 * 1024) { e.target.value = ''; return toast('A foto deve ter até 5 MB.'); }
  const image = new Image();
  image.onload = () => {
    state.petPhotoEditor = { file, image, zoom: 1, x: 0, y: 0 };
    $('#pet-photo-editor')?.classList.add('active');
    drawPetPhotoCrop();
  };
  image.onerror = () => toast('Não foi possível abrir esta imagem.');
  image.src = URL.createObjectURL(file);
  ['crop-zoom', 'crop-x', 'crop-y'].forEach(id => document.getElementById(id)?.addEventListener('input', updatePetPhotoCrop));
}
function updatePetPhotoCrop() {
  if (!state.petPhotoEditor) return;
  state.petPhotoEditor.zoom = Number($('#crop-zoom')?.value || 100) / 100;
  state.petPhotoEditor.x = Number($('#crop-x')?.value || 0) / 100;
  state.petPhotoEditor.y = Number($('#crop-y')?.value || 0) / 100;
  drawPetPhotoCrop();
}
function drawPetPhotoCrop(targetCanvas = $('#pet-photo-canvas')) {
  const editor = state.petPhotoEditor;
  if (!editor || !targetCanvas) return;
  const ctx = targetCanvas.getContext('2d'), size = targetCanvas.width;
  const baseScale = Math.max(size / editor.image.naturalWidth, size / editor.image.naturalHeight);
  const scale = baseScale * editor.zoom;
  const width = editor.image.naturalWidth * scale, height = editor.image.naturalHeight * scale;
  const maxX = Math.max(0, (width - size) / 2), maxY = Math.max(0, (height - size) / 2);
  const dx = (size - width) / 2 + editor.x * maxX;
  const dy = (size - height) / 2 + editor.y * maxY;
  ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, size, size);
  ctx.drawImage(editor.image, dx, dy, width, height);
}
function croppedPetPhotoBlob() {
  return new Promise(resolve => {
    if (!state.petPhotoEditor) return resolve(null);
    const canvas = document.createElement('canvas'); canvas.width = 800; canvas.height = 800;
    drawPetPhotoCrop(canvas);
    canvas.toBlob(blob => resolve(blob), 'image/jpeg', .9);
  });
}
async function savePet(e) {
  e.preventDefault();
  const button = e.submitter, f = new FormData(e.target), old = petById(String(f.get('id'))), id = old?.id || crypto.randomUUID();
  const originalFile = f.get('photoFile');
  if (originalFile?.size && originalFile.size > 5 * 1024 * 1024) return toast('A foto deve ter até 5 MB.');
  setBusy(button, true, 'Salvando...');
  try {
    let photoPath = old?.photoPath || null;
    const payload = {
      id,
      owner_id: state.authUser.id,
      name: String(f.get('name')).trim(),
      species: String(f.get('species')),
      breed: String(f.get('breed') || ''),
      sex: String(f.get('sex') || ''),
      birth_date: String(f.get('birthDate') || '') || null,
      adoption_date: String(f.get('adoptionDate') || '') || null,
      color: String(f.get('color') || ''),
      current_weight: Number(f.get('weight')) || null,
      neutered: String(f.get('neutered') || 'Não informado'),
      has_microchip: String(f.get('microchip') || 'Não informado'),
      microchip_number: String(f.get('microchipNumber') || ''),
      notes: String(f.get('notes') || ''),
      photo_path: photoPath
    };
    const saved = old ? await sb.from('pets').update(payload).eq('id', id) : await sb.from('pets').insert(payload);
    if (saved.error) throw saved.error;

    const croppedBlob = await croppedPetPhotoBlob();
    if (croppedBlob) {
      const path = `${state.authUser.id}/${id}/profile-${Date.now()}.jpg`;
      const uploaded = await sb.storage.from('pet-files').upload(path, croppedBlob, { contentType: 'image/jpeg', upsert: false });
      if (uploaded.error) throw uploaded.error;
      const updated = await sb.from('pets').update({ photo_path: path }).eq('id', id);
      if (updated.error) throw updated.error;
      if (photoPath) await sb.storage.from('pet-files').remove([photoPath]);
    }
    state.petPhotoEditor = null;
    closeModal();
    state.selectedPetId = id;
    state.route = 'pet';
    await loadData();
    toast('Pet salvo na nuvem.');
  } catch (error) {
    toast(friendlyError(error, 'Não foi possível salvar o pet.'));
  } finally { setBusy(button, false); }
}

async function deletePet(id) {
  if (!confirm('Excluir este pet e todos os registros, documentos e lembretes relacionados?')) return;
  const pet = petById(id), recordPaths = state.db.records.filter(r => r.petId === id && r.attachment).map(r => r.attachment.path), expensePaths = state.db.expenses.filter(x => x.petId === id && x.attachment).map(x => x.attachment.path);
  const paths = [pet?.photoPath, ...recordPaths, ...expensePaths].filter(Boolean);
  if (paths.length) await sb.storage.from('pet-files').remove(paths);
  const { error } = await sb.from('pets').delete().eq('id', id);
  if (error) return toast(friendlyError(error));
  closeModal(); state.route = 'pets'; state.selectedPetId = null; await loadData(); toast('Pet excluído.');
}

async function saveRecord(e) {
  e.preventDefault();

  if (file?.size) {
    const limit = file.type === 'application/pdf' ? 10 : 5;
    if (file.size > limit * 1024 * 1024) return toast(`O arquivo deve ter até ${limit} MB.`);

      title: String(f.get('title')).trim(),

      const attachment = await sb.from('attachments').insert({
        owner_id: state.authUser.id,

        bucket_id: 'pet-files',
        object_path: path,
        file_name: file.name,
        mime_type: file.type,
        size_bytes: file.size,
        category,
        ai_status: 'needs_review',

function nextDayCompact(date) { const d = new Date(`${date}T12:00:00`); d.setDate(d.getDate() + 1); return d.toISOString().slice(0, 10).replaceAll('-', ''); }
function calendarIcs({ title, date, description = '' }) {
  const stamp = new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d{3}Z$/, 'Z');
  const start = date.replaceAll('-', ''), end = nextDayCompact(date);
  const clean = value => String(value).replace(/\\/g, '\\\\').replace(/\n/g, '\\n').replace(/,/g, '\\,').replace(/;/g, '\\;');
  return ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Boopy//PT-BR','BEGIN:VEVENT',`UID:${crypto.randomUUID()}@boopy`,`DTSTAMP:${stamp}`,`DTSTART;VALUE=DATE:${start}`,`DTEND;VALUE=DATE:${end}`,`SUMMARY:${clean(title)}`,`DESCRIPTION:${clean(description)}`,'END:VEVENT','END:VCALENDAR'].join('\r\n');
}
function openCalendarOptions(event) {
  state.modal = `<div class="modal-head"><div><h2>✅ Registro salvo</h2><p class="meta" style="margin:4px 0 0">O lembrete foi criado no Boopy.</p></div><button class="icon-btn" data-close-modal>✕</button></div><div class="info-hint"><span class="info-icon">i</span><span>Adicionar à agenda é opcional. Você poderá revisar o evento antes de confirmar.</span></div><div class="calendar-actions"><button class="btn primary" data-google-calendar>Adicionar ao Google Agenda</button><button class="btn ghost" data-outlook-calendar>Adicionar ao Outlook (.ics)</button><button class="btn secondary" data-close-modal>Concluir</button></div>`;
  renderModal();
  $('[data-google-calendar]')?.addEventListener('click', () => {
    const dates = `${event.date.replaceAll('-', '')}/${nextDayCompact(event.date)}`;
    const url = `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(event.title)}&dates=${dates}&details=${encodeURIComponent(event.description || '')}`;
    window.open(url, '_blank', 'noopener');
  });
  $('[data-outlook-calendar]')?.addEventListener('click', () => {
    const blob = new Blob([calendarIcs(event)], { type: 'text/calendar;charset=utf-8' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `${safeFileName(event.title || 'evento-boopy')}.ics`; a.click(); URL.revokeObjectURL(a.href);
  });
}

async function requestAccountDeletion() {
  if (!confirm('Deseja solicitar a exclusão da sua conta e de todos os dados? Durante a beta, a solicitação será revisada administrativamente.')) return;
  const { error } = await sb.from('account_deletion_requests').upsert({ user_id: state.authUser.id, status: 'requested' }, { onConflict: 'user_id' });
  if (error) return toast(friendlyError(error));
  toast('Solicitação registrada. Você será desconectada.');
  setTimeout(logout, 1000);
}

async function handleAuthEvent(event, session) {
  state.session = session;
  state.authUser = session?.user || null;
  if (!session) {
    state.db = { users: [], pets: [], records: [], expenses: [], reminders: [], posts: [], reports: [] };
    state.loading = false; state.route = 'home'; state.selectedPetId = null; render(); return;
  }
  const isRecovery = event === 'PASSWORD_RECOVERY';
  await loadData();
  if (isRecovery) openPasswordRecoveryModal();
}
function openPasswordRecoveryModal() {
  state.modal = `<div class="modal-head"><div><h2>Definir nova senha</h2><p class="meta" style="margin:5px 0 0">Crie uma nova senha com pelo menos 8 caracteres.</p></div><button class="icon-btn" data-close-modal>✕</button></div><form id="recovery-form" class="form-grid"><div class="field full"><label for="recovery-password">Nova senha</label><div class="password-wrap"><input id="recovery-password" type="password" name="password" autocomplete="new-password" minlength="8" required><button type="button" class="password-toggle" data-toggle-password="recovery-password" aria-label="Mostrar senha" title="Mostrar senha">👁</button></div></div><div class="field full"><label for="recovery-password-confirm">Confirmar nova senha</label><div class="password-wrap"><input id="recovery-password-confirm" type="password" name="passwordConfirm" autocomplete="new-password" minlength="8" required><button type="button" class="password-toggle" data-toggle-password="recovery-password-confirm" aria-label="Mostrar senha" title="Mostrar senha">👁</button></div></div><div class="field full"><button class="btn primary full">Atualizar senha</button></div></form>`;
  renderModal();
  $('#recovery-form').addEventListener('submit', async e => {
    e.preventDefault();
    const button = e.submitter, f = new FormData(e.target);
    const password = String(f.get('password'));
    const passwordConfirm = String(f.get('passwordConfirm'));
    if (password !== passwordConfirm) return toast('As senhas não coincidem. Confira e tente novamente.');
    setBusy(button, true, 'Atualizando...');
    const { error } = await sb.auth.updateUser({ password });
    setBusy(button, false);
    if (error) return toast(friendlyError(error));
    closeModal();
    toast('Senha atualizada com sucesso. Entre novamente com sua nova senha.');
    setTimeout(async () => {
      await sb.auth.signOut();
      state.authTab = 'login';
    }, 1200);
  });
}

async function boot() {
  const { data, error } = await sb.auth.getSession();
  if (error) console.error(error);
  state.session = data.session;
  state.authUser = data.session?.user || null;
  sb.auth.onAuthStateChange((event, session) => setTimeout(() => handleAuthEvent(event, session), 0));
  if (state.authUser) await loadData();
  else { state.loading = false; render(); }
}

boot();

  </script>
